<!doctype html>
<html>
<head>
<title>shucks</title>

<meta property="og:title" content="aw shucks">
<meta property="og:type" content="video.other">
<meta property="og:url" content="https://shucks.cesustheteapot.dpdns.org/">
<meta property="og:video" content="https://shucks.cesustheteapot.dpdns.org/shucks.mp4">
<meta property="og:video:type" content="video/mp4">
<meta property="og:video:width" content="800">
<meta property="og:video:height" content="600">
<meta name="theme-color" content="#00ff00">

<link id="favicon" rel="icon" type="image/png" href="favicon.gif">

<style>
  body { margin: 0; background: black; color: lime; overflow: hidden; font-family: monospace; }
  #big-boi { 
    font-size: 12vw; text-align: center; cursor: pointer; position: absolute; 
    top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; 
    background: black; padding: 20px; border: 3px solid lime; 
    box-shadow: 0 0 20px lime;
    transition: transform 0.1s;
  }
  #big-boi:active { transform: translate(-50%, -50%) scale(0.9); }
  #spam { position: absolute; top: 0; left: 0; z-index: 1; opacity: 0.3; word-wrap: break-word; }
</style>
</head>
<body>
  <div id="big-boi">shucks boi</div>
  <div id="spam"></div>
  
  <script>
    document.getElementById('spam').innerText = 'shucks boii '.repeat(5000);
    
    // create hidden video and canvas to stream directly to favicon slot
    const favLink = document.getElementById('favicon');
    const video = document.createElement('video');
    video.src = 'shucks.mp4';
    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    
    const canvas = document.createElement('canvas');
    canvas.width = 32;
    canvas.height = 32;
    const ctx = canvas.getContext('2d');

    // starts streaming video pixels to tab icon once interaction happens
    document.addEventListener('click', () => {
      video.play();
    }, { once: true });

    setInterval(() => {
      if (!video.paused && !video.ended) {
        ctx.clearRect(0, 0, 32, 32);
        ctx.drawImage(video, 0, 0, 32, 32);
        favLink.href = canvas.toDataURL('image/png');
      }
    }, 40); // smooth 25fps stream directly to tab icon

    document.getElementById('big-boi').onclick = () => {
      let popup = window.open('', 'shuckswindow', 'width=800,height=600');
      
      popup.document.write(`
        <style>
          body { margin:0; background:black; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; }
          
          @keyframes hardcorebop {
            0% { transform: scale(1.15, 0.85) translateY(20px); animation-timing-function: cubic-bezier(0.1, 1.2, 0.3, 1); filter: drop-shadow(0 0 30px lime); }
            25% { transform: scale(0.95, 1.05) translateY(-5px); }
            50% { transform: scale(1) translateY(0); filter: drop-shadow(0 0 5px lime); }
            100% { transform: scale(1) translateY(0); }
          }
          
          .bop-container {
            width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
            animation: hardcorebop 308ms infinite;
          }
          
          video { max-width:90%; max-height:90%; border: 4px solid lime; border-radius: 12px; }
        </style>
        <body>
          <div class="bop-container">
            <video src="shucks.mp4" autoplay loop controls></video>
          </div>
          
          <script>
            setInterval(() => {
              try {
                window.moveBy((Math.random() - 0.5) * 50, (Math.random() - 0.5) * 50);
              } catch(e) {}
            }, 40);
          <\/script>
        </body>
      `);
    };
  </script>
</body>
</html>
